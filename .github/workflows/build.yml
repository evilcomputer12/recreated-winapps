name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (apps + CLI)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Calculator.app and Paint.app
        run: |
          set -eo pipefail
          for app in Calculator Paint; do
            ( cd "$app"
              xcodegen generate
              xcodebuild -project "$app.xcodeproj" -scheme "$app" -configuration Release \
                         -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -3 )
            ditto -c -k --sequesterRsrc --keepParent \
              "$app/build/Build/Products/Release/$app.app" "$app-macOS-arm64.zip"
          done
      - name: Build calc CLI (macOS, universal logic test)
        run: |
          set -eo pipefail
          ( cd CalcCoreLinux && swift build -c release && ./.build/release/calc selftest )
          cp CalcCoreLinux/.build/release/calc calc-macos-arm64
          tar czf calc-macos-arm64.tar.gz calc-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            Calculator-macOS-arm64.zip
            Paint-macOS-arm64.zip
            calc-macos-arm64.tar.gz

  linux:
    name: Linux (CLI)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build calc CLI (Linux, static stdlib)
        run: |
          set -eo pipefail
          cd CalcCoreLinux
          swift build -c release --static-swift-stdlib
          ./.build/release/calc selftest
          cp .build/release/calc ../calc-linux-x86_64
          cd ..
          tar czf calc-linux-x86_64.tar.gz calc-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: calc-linux-x86_64.tar.gz

  release:
    name: Publish release
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish binaries to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            macos-binaries/Calculator-macOS-arm64.zip
            macos-binaries/Paint-macOS-arm64.zip
            macos-binaries/calc-macos-arm64.tar.gz
            linux-binaries/calc-linux-x86_64.tar.gz
